{% extends "base.html" %}{% block title %}Create account | Campus to Career{% endblock %}{% block content %}<section class="form-page"><div class="form-card"><span class="pill">GET STARTED</span><h1>Create your account</h1><p>Choose how you want to use Campus to Career.</p><form method="post"><label>Full name or company name</label><input name="name" required maxlength="120" placeholder="Enter your name"><label>Email address</label><input type="email" name="email" required placeholder="you@example.com"><label>Password (minimum 8 characters)</label><input type="password" name="password" required minlength="8" placeholder="Create a password"><label>Account type</label><select name="role" required><option value="student">Student — browse and apply for jobs</option><option value="company">Company — post jobs and manage applications</option></select><button class="btn full" type="submit">Create account</button></form><p class="form-bottom">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></section>{% endblock %}
