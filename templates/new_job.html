{% extends "base.html" %}{% block title %}Post a job | Campus to Career{% endblock %}{% block content %}<section class="form-page"><div class="form-card wide"><span class="pill">EMPLOYER SPACE</span><h1>Post an opportunity</h1><p>Your listing will be visible to students.</p><form method="post"><label>Job title</label><input name="title" required placeholder="e.g. Python Developer Intern"><label>Company name</label><input name="company_name" required placeholder="Company name"><label>Location</label><input name="location" placeholder="e.g. Bengaluru / Remote"><label>Type</label><select name="job_type"><option>Internship</option><option>Full-time</option><option>Part-time</option><option>Contract</option></select><label>Description and requirements</label><textarea name="description" required rows="5" placeholder="Describe the role, skills, and how students can contribute"></textarea><button class="btn full" type="submit">Publish job</button></form></div></section>{% endblock %}
