services:
  - type: web
    name: campus-to-career
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-to-career-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
databases:
  - name: campus-to-career-db
    plan: free
